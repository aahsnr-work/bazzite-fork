# Determinate Nix lives on the persistent /var so it survives image rebase.
# The /nix -> /var/nix symlink is baked into the image at build time
# (build_files/install/setup-nix-base.sh); a runtime tmpfiles.d rule cannot
# create new top-level entries on a deployed composefs root, so only the
# mutable /var side is created here.
d /var/nix 0755 root root - -
